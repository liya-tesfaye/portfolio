map $request_method $timeline_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $timeline_limit_key zone=timeline_limit:10m rate=1r/m;
server {
	listen 80;
	server_name liya-demo1.duckdns.org;

	if ($host = liya-demo1.duckdns.org) {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	server_name liya-demo1.duckdns.org;

        location /api/timeline_post {
                limit_req zone=timeline_limit nodelay;
		limit_req_status 429;
                proxy_pass http://myportfolio:5000;
        }

	location / {
		proxy_pass http://myportfolio:5000/;
	}

	# Load the certificate files.
	ssl_certificate /etc/letsencrypt/live/liya-demo1.duckdns.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/liya-demo1.duckdns.org/privkey.pem;
	ssl_trusted_certificate /etc/letsencrypt/live/liya-demo1.duckdns.org/chain.pem;
}
